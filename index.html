<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopi – Smart Shopping Assistant</title>

  <!-- Re-skin: Override these variables before loading shopi CSS to change the theme -->
  <!--
  <style>
    :root {
      --shopi-primary: #2563EB;
      --shopi-primary-hover: #1D4ED8;
      --shopi-primary-contrast: #FFFFFF;
    }
  </style>
  -->

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/chat.css">

  <!-- No import map needed: Gemini API calls go through Cloudflare Worker proxy -->
</head>
<body>

  <!-- ═══ Demo Store Page (placeholder behind widget) ═══ -->
  <div class="shopi-store-demo">
    <header class="shopi-store-demo__header">
      <div class="shopi-store-demo__title">Shopi Store</div>
      <nav class="shopi-store-demo__nav">
        <span>New Arrivals</span>
        <span>Collections</span>
        <span>Sale</span>
        <span>About</span>
      </nav>
    </header>

    <section class="shopi-store-demo__hero">
      <h2>Summer Collection 2026</h2>
      <p>Discover our curated selection of sustainable, stylish pieces for the season.</p>
    </section>

    <section class="shopi-store-demo__grid">
      <div class="shopi-store-demo__card">
        <div class="shopi-store-demo__card-img">Image</div>
        <div class="shopi-store-demo__card-body">
          <div class="shopi-store-demo__card-title">Summer Floral Dress</div>
          <div class="shopi-store-demo__card-price">$39.99</div>
        </div>
      </div>
      <div class="shopi-store-demo__card">
        <div class="shopi-store-demo__card-img">Image</div>
        <div class="shopi-store-demo__card-body">
          <div class="shopi-store-demo__card-title">Classic White Sneakers</div>
          <div class="shopi-store-demo__card-price">$64.99</div>
        </div>
      </div>
      <div class="shopi-store-demo__card">
        <div class="shopi-store-demo__card-img">Image</div>
        <div class="shopi-store-demo__card-body">
          <div class="shopi-store-demo__card-title">Slim Fit Denim Jeans</div>
          <div class="shopi-store-demo__card-price">$54.99</div>
        </div>
      </div>
      <div class="shopi-store-demo__card">
        <div class="shopi-store-demo__card-img">Image</div>
        <div class="shopi-store-demo__card-body">
          <div class="shopi-store-demo__card-title">Canvas Tote Bag</div>
          <div class="shopi-store-demo__card-price">$24.99</div>
        </div>
      </div>
    </section>
  </div>

  <!-- ═══ Shopi Chat Widget ═══ -->
  <div id="shopi-chat-widget" class="shopi-widget" role="complementary" aria-label="Shopi Chat" data-state="closed">

    <!-- Floating Bubble -->
    <button id="shopi-bubble" class="shopi-bubble" aria-label="Open chat" aria-expanded="false">
      <svg class="shopi-bubble-icon shopi-bubble-icon--open" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <svg class="shopi-bubble-icon shopi-bubble-icon--close" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span id="shopi-bubble-badge" class="shopi-bubble-badge" hidden aria-live="polite"></span>
    </button>

    <!-- Chat Panel -->
    <div id="shopi-panel" class="shopi-panel shopi-panel--hidden" role="dialog" aria-label="Chat with Shopi">

      <!-- Panel Header -->
      <div class="shopi-panel__header">
        <div class="shopi-panel__brand">
          <img class="shopi-panel__logo" src="assets/logo.svg" alt="" width="28" height="28">
          <span class="shopi-panel__title">Shopi</span>
        </div>
        <button id="shopi-panel-close" class="shopi-panel__close" aria-label="Close chat">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Message List -->
      <div id="shopi-messages" class="shopi-messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

      <!-- Quick Action Chips -->
      <div id="shopi-chips" class="shopi-chips">
        <button class="shopi-chip" data-message="Show me your best sellers">Best sellers</button>
        <button class="shopi-chip" data-message="What deals do you have today?">Today's deals</button>
        <button class="shopi-chip" data-message="Help me find a gift">Gift ideas</button>
      </div>

      <!-- Input Area -->
      <form id="shopi-input-form" class="shopi-input" role="form" aria-label="Send a message">
        <input
          id="shopi-input"
          class="shopi-input__field"
          type="text"
          placeholder="Ask about products..."
          autocomplete="off"
          maxlength="500"
          aria-label="Type your message"
        >
        <button id="shopi-send" class="shopi-input__send" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>

    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
